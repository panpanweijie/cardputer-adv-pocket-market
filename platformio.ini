[platformio]
default_envs = stock-monitor

; Cardputer-Adv Stock Monitor
; https://github.com/ansonlianson/cardputer-adv-stock-monitor

[env:stock-monitor]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    bblanchon/ArduinoJson@6.21.5
extra_scripts =
    pre:tools/public_build.py
    pre:tools/embed_phone_page.py

[env:stock-monitor-standard]
extends = env:stock-monitor
build_flags =
    ${env:stock-monitor.build_flags}
    -DSTOCK_ENABLE_MOTION=0
